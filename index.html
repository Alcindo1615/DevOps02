
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dark Mode Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
        }

        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 40px;
            text-align: center;
        }

        .box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #333;
            color: #aaa;
        }
    </style>
</head>
<body>

<header>
    <h1>🌙 Página Oscura</h1>
</header>

<main>
    <div class="box">
        <h2>Modo Dark</h2>
        <p>Esta página usa fondo negro con texto blanco.</p>
        <button onclick="mensaje()">Click aquí</button>
    </div>
</main>

<footer>
    <p>Hecho con estilo oscuro 😎</p>
</footer>

<script>
    function mensaje() {
        alert("¡Estás en modo oscuro 🌙!");
    }
</script>

</body>
</html>
